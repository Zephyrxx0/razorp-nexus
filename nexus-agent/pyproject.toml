[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus_agent"
version = "0.1.0"
description = "Project Nexus Google ADK Orchestrator Agent and Tool Suite"
authors = [{ name = "Nexus Team" }]
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.8.0",
    "google-genai>=0.8.6",
    "google-generativeai>=0.8.3",
    "razorpay>=2.0.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.2",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "nexus_agent", "../db/py"]
testpaths = ["tests"]
asyncio_mode = "auto"
